name: cipf-platform

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${CIPF_BIND_ADDRESS:-127.0.0.1}:${CIPF_HOST_PORT:-3001}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY_HOPS: ${CIPF_TRUST_PROXY_HOPS:-1}
      UPLOAD_DIR: /app/uploads

      PUBLIC_APP_URL: ${CIPF_PUBLIC_APP_URL:-}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-}
      AUTH_TOKEN_TTL: ${AUTH_TOKEN_TTL:-8h}
      AUTH_IDLE_TIMEOUT: ${AUTH_IDLE_TIMEOUT:-15m}
      AUTH_COOKIE_NAME: cipf_auth
      COOKIE_SECURE: ${CIPF_COOKIE_SECURE:-true}
      CORS_ALLOWED_ORIGINS: ${CIPF_PUBLIC_APP_URL:-}

      SUPER_ADMIN_BOOTSTRAP_EMAIL: ${SUPER_ADMIN_BOOTSTRAP_EMAIL:-}
      SUPER_ADMIN_BOOTSTRAP_PASSWORD: ${SUPER_ADMIN_BOOTSTRAP_PASSWORD:-}
      SUPER_ADMIN_BOOTSTRAP_FIRST_NAME: ${SUPER_ADMIN_BOOTSTRAP_FIRST_NAME:-System}
      SUPER_ADMIN_BOOTSTRAP_LAST_NAME: ${SUPER_ADMIN_BOOTSTRAP_LAST_NAME:-Owner}

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${CIPF_DB_NAME:-cip_election}
      DB_USER: ${CIPF_DB_USER:-cipf_user}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_SSL: "false"
      DB_AUTO_CREATE: "false"

      GROQ_API_KEY: ${GROQ_API_KEY:-}

      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      - cipf_uploads:/app/uploads

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CIPF_DB_NAME:-cip_election}
      POSTGRES_USER: ${CIPF_DB_USER:-cipf_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      - cipf_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CIPF_DB_USER:-cipf_user} -d ${CIPF_DB_NAME:-cip_election}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cipf_postgres_data:
  cipf_uploads:
